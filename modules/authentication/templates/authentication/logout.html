{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logged Out - {{ brand_name }}</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'core/icons/logo.svg' %}">
  <link rel="stylesheet" href="{% static 'core/css/tokens.css' %}">
  <link rel="stylesheet" href="{% static 'authentication/css/auth.css' %}">
  <link rel="stylesheet" href="{% static 'authentication/css/backdrop.css' %}">
</head>
<body class="auth-bg">
{% include 'authentication/partials/hive_backdrop.html' %}
  {% include 'authentication/partials/brand.html' %}
  <div class="auth-card">
    <h2>See you next time! 👋</h2>
    <p>You have been successfully logged out.</p>

    <div style="margin-top: 20px;">
      <a href="{% url 'auth:login' %}" class="btn">Login Again</a>
    </div>

    <p class="switch-auth" style="margin-top: 15px;">
      Don’t have an account? <a href="{% url 'auth:signup' %}">Sign up</a>
    </p>
  </div>
</body>
</html>
