<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 200" role="img" aria-label="Whiteboard doodles">
  <!-- Placeholder board for the teacher dashboard until a session is saved.
       Colours match core/css/tokens.css (an <img> cannot read CSS variables). -->
  <rect width="340" height="200" fill="#fffdf7"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- sun -->
    <circle cx="58" cy="52" r="15" stroke="#f9d342" stroke-width="3.5"/>
    <g stroke="#f9d342" stroke-width="3">
      <path d="M58 24v-7M58 87v-7M30 52h-7M93 52h-7M38 32l-5-5M83 77l-5-5M38 72l-5 5M83 27l-5 5"/>
    </g>
    <!-- arrows -->
    <path d="M110 46c30-16 62-14 92 2" stroke="#2bb3b1" stroke-width="3.2"/>
    <path d="M194 38l9 10-13 3" stroke="#2bb3b1" stroke-width="3.2"/>
    <path d="M168 84c12-6 24-6 34 0" stroke="#e8a317" stroke-width="2.6"/>
    <path d="M196 78l7 6-9 3" stroke="#e8a317" stroke-width="2.6"/>
    <!-- triangle with a dot -->
    <path d="M58 140l22-36 22 36z" stroke="#253444" stroke-width="3"/>
    <circle cx="80" cy="127" r="2.6" fill="#e8a317" stroke="none"/>
    <!-- speech bubble -->
    <path d="M222 70h28a8 8 0 0 1 8 8v18a8 8 0 0 1-8 8h-12l-8 8v-8h-8a8 8 0 0 1-8-8V78a8 8 0 0 1 8-8z" stroke="#253444" stroke-width="2.8"/>
    <path d="M226 84h20M226 92h13" stroke="#2bb3b1" stroke-width="2.4"/>
    <!-- sparkles -->
    <path d="M216 36l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" stroke="#f9d342" stroke-width="2.4" fill="#fde7a3"/>
    <path d="M292 110l2.5 5.5 5.5 2.5-5.5 2.5-2.5 5.5-2.5-5.5-5.5-2.5 5.5-2.5z" stroke="#f9d342" stroke-width="2.2" fill="#fde7a3"/>
    <!-- square and teal triangle -->
    <rect x="216" y="138" width="40" height="30" rx="2" stroke="#253444" stroke-width="2.8"/>
    <path d="M270 168l19-31 19 31z" stroke="#2bb3b1" stroke-width="3"/>
    <!-- wavy ink line -->
    <path d="M30 176c22-10 40 6 62-2s38-12 60-2 38 6 58-4" stroke="#2bb3b1" stroke-width="3.4"/>
    <!-- underline under the words -->
    <path d="M124 128h70M124 136h48" stroke="#2bb3b1" stroke-width="2.6"/>
  </g>
  <text x="124" y="118" font-family="Figtree, 'Segoe UI', sans-serif" font-size="15" font-weight="800" fill="#1f2a37">Think together!</text>
  <text x="222" y="190" font-family="Figtree, 'Segoe UI', sans-serif" font-size="9.5" font-weight="700" fill="#1f2a37">draw • discover • grow</text>
  <!-- little bee -->
  <g transform="translate(292 40)">
    <ellipse cx="-6" cy="-8" rx="7" ry="4.5" fill="#d9f2f0" stroke="#253444" stroke-width="1.6" transform="rotate(-25 -6 -8)"/>
    <ellipse cx="6" cy="-8" rx="7" ry="4.5" fill="#d9f2f0" stroke="#253444" stroke-width="1.6" transform="rotate(25 6 -8)"/>
    <ellipse cx="0" cy="2" rx="9" ry="10" fill="#f9d342" stroke="#253444" stroke-width="1.8"/>
    <path d="M-8.5 0h17M-8 6h16" stroke="#253444" stroke-width="2.2"/>
    <circle cx="0" cy="-10" r="4" fill="#253444"/>
  </g>
</svg>
